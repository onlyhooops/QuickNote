name: 记入快记
identifier: com.quicknote.popclip
icon: icon.png
description: 把选中文本一键写入本机「快记」，生成时间点。
keywords: quicknote 快记 notes 摘抄 记录
macos version: "10.15"
options:
  - identifier: baseurl
    type: string
    label: 服务地址
    default value: http://127.0.0.1:3987
  - identifier: tags
    type: string
    label: 默认标签（逗号分隔）
  - identifier: token
    type: secret
    label: 访问令牌（可选）
    keychain: local
  - identifier: keepmarkdown
    type: boolean
    label: 保留 Markdown 排版
    description: 关闭（推荐）：保留网页富文本排版（标题/列表/引用/代码块/表格）；开启：按 Markdown 语法解析（适合复制到的是 Markdown 源码）
    default value: '0'
actions:
  - title: 记入快记
    requirements: [text]
    captureHtml: true
    interpreter: bash
    shell script file: quicknote.sh
