<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#faf9f7" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="快记" />
    <meta name="description" content="极简随手记：第一屏即录入，时间点构筑时间轴，随览与去年今时" />
    <script>
      // 首帧前应用主题，避免闪烁（与 src/theme.js 的取值保持一致：
      // light | dark | xuan | xuan-dark | sangpi | sangpi-dark）
      (function () {
        try {
          var META = {
            light: '#faf9f7',
            dark: '#101013',
            xuan: '#f3eee0',
            'xuan-dark': '#1a1811',
            sangpi: '#e0cba2',
            'sangpi-dark': '#1b1710'
          };
          var pref = localStorage.getItem('quicknote.theme') || 'auto';
          var dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var paper = pref === 'xuan' || pref === 'sangpi';
          var eff =
            pref === 'auto'
              ? dark
                ? 'dark'
                : 'light'
              : paper
                ? dark
                  ? pref + '-dark'
                  : pref
                : pref;
          document.documentElement.dataset.theme = eff;
          var m = document.querySelector('meta[name="theme-color"]');
          if (m && META[eff]) m.setAttribute('content', META[eff]);
        } catch (e) {}
      })();
    </script>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>快记 · QuickNote</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
